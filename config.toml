# SARPBC (NPUB30035) -- ps3recomp project configuration
#
# Copied from ps3recomp templates/project. Most of it is informational: the lift
# is driven by tools/relift.sh, and the backend is chosen at build time.

[input]
# Path to the decrypted PS3 ELF (EBOOT.BIN after SELF decryption)
elf_path = "game/EBOOT.elf"

# Optional: path to the game's PARAM.SFO for metadata
sfo_path = "vfs/dev_hdd0/game/NPUB30035/PARAM.SFO"

# --- Controls (read by the game at start, src/overrides/input_config.cpp) ---
# Every UPPER-CASE key here becomes the environment variable of that name,
# unless the environment already has it (KEY_R2=F tools/run.sh wins over this).
# A gamepad works without any of this (SDL2, any number of pads).
#
# Keyboard and mouse -> pad port 0 (src/overrides/input_kbm.cpp). Each value is
# a list of keys, "none" for no key. Keys are places on the keyboard (SDL
# scancodes): WASD stays WASD on AZERTY. Names: A-Z 0-9 F1-F12 Space Enter Tab
# Esc Backspace Shift Ctrl Alt LShift RShift LCtrl RCtrl LAlt RAlt Up Down Left
# Right Insert Delete Home End PageUp PageDown CapsLock Minus Equals LBracket
# RBracket Semicolon Quote Comma Period Slash Backslash Grave Num0-Num9
# Mouse1 (left) Mouse2 (right) Mouse3 (middle) Mouse4 Mouse5 WheelUp WheelDown.
# A key on R2/L2 is a full trigger pull (throttle / brake).
KEY_R2         = "W"                       # throttle
KEY_L2         = "S"                       # brake / reverse
KEY_MOVE_UP    = "W"                       # left stick: air pitch
KEY_MOVE_DOWN  = "S"
KEY_MOVE_LEFT  = "A"                       # left stick: steer
KEY_MOVE_RIGHT = "D"
KEY_CROSS      = "Space Mouse2"            # jump
KEY_CIRCLE     = "Shift Mouse1 Backspace"  # boost
KEY_SQUARE     = "Ctrl"                    # powerslide
KEY_TRIANGLE   = "R"
KEY_L1         = "Q"
KEY_R1         = "E"
KEY_L3         = "C"
KEY_R3         = "V"
KEY_START      = "Esc Enter"               # Esc no longer closes the window while bound
KEY_SELECT     = "Tab"
KEY_UP         = "Up"                      # d-pad
KEY_DOWN       = "Down"
KEY_LEFT       = "Left"
KEY_RIGHT      = "Right"
KEY_LOOK_UP    = "I"                       # right stick
KEY_LOOK_DOWN  = "K"
KEY_LOOK_LEFT  = "J"
KEY_LOOK_RIGHT = "L"
# SARPBC_KEYBOARD = 0   # no keyboard/mouse at all
# SARPBC_KBM_LOG  = 1   # log what the keys hold whenever it changes
# PAD_NO_HOST     = 1   # no pad or key of the host reaches the game (scripted runs)
# PAD_TRACE       = 1   # log what reaches the game's pad buffer whenever it changes

[output]
# Directory for generated recompiled C/C++ source files
output_dir = "src/recomp/"

# Prefix for generated function names
func_prefix = "recomp_"

# Generate a function table (g_recompiled_funcs) source file
generate_func_table = true

[modules]
# For each PS3 system module, choose HLE (high-level emulation stub) or
# LLE (low-level emulation -- recompile the actual PRX).
#
# HLE is faster to develop and sufficient for most modules.
# LLE may be needed for modules with complex internal state.
#
# Supported values: "hle", "lle", "auto"
#   "auto" uses HLE if a stub exists, otherwise attempts LLE.

cellSysutil      = "hle"
cellSysmodule    = "hle"
sysPrxForUser    = "hle"
cellFs           = "hle"
cellPad          = "hle"
cellAudio        = "hle"
cellGcmSys       = "hle"
cellSpurs        = "hle"
cellSync         = "hle"
cellSync2        = "hle"
cellPngDec       = "hle"
cellJpgDec       = "hle"
cellFont         = "hle"
cellFreeType     = "hle"
cellL10n         = "hle"
cellResc         = "hle"
cellSaveData     = "hle"
cellGame         = "hle"
cellNetCtl       = "hle"
cellSysutilNp    = "hle"

[memory]
# Main memory size in megabytes (PS3 has 256 MB main RAM)
main_ram_mb = 256

# RSX video memory size in megabytes (PS3 has 256 MB VRAM)
vram_mb = 256

# Stack size per PPU thread in kilobytes
thread_stack_kb = 1024

[threading]
# Maximum number of PPU threads
max_ppu_threads = 64

# Maximum number of SPU threads (set to 0 to disable SPU emulation)
max_spu_threads = 6

# Use host threads for PPU thread emulation (true = 1:1 mapping)
use_host_threads = true

[graphics]
# Graphics backend. main.cpp picks this at BUILD time from the host it is
# compiled on -- Vulkan on Linux (primary), D3D12 on Windows (later), Metal on
# Apple, the null backend elsewhere -- because that is where the backends exist.
# Change the selection in main.cpp, not here.
#
# Recognised names: "vulkan", "d3d12", "metal", "null"
backend = "auto"

# Window resolution (0 = match the game's native resolution)
width = 0
height = 0

# VSync mode: "on", "off", "adaptive"
vsync = "on"

# Upscaling factor (1 = native, 2 = 2x, etc.)
scale_factor = 1

[audio]
# Audio backend, likewise chosen at build time: WASAPI on Windows, SDL2
# everywhere else (see libs/audio/cellAudio.c). Set SDL_AUDIODRIVER=dummy to
# run with no sound device at all.
#
# Recognised names: "wasapi", "sdl", "null"
backend = "auto"

# Sample rate (PS3 native is 48000)
sample_rate = 48000

# Buffer size in samples
buffer_size = 512

[debug]
# Enable verbose logging of HLE function calls
log_hle_calls = true

# Log all unimplemented NID lookups
log_missing_nids = true

# Break on unimplemented syscall (useful with debugger attached)
break_on_unimplemented = false

# Dump recompiled function disassembly
dump_disassembly = false

# Guest address to break at (0 = disabled)
breakpoint_address = 0
